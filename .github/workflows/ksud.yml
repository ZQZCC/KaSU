name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r30

    - name: Check C formatting
      run: |
        "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang-format" \
          --dry-run --Werror userspace/ksud/src/*.c userspace/ksud/src/*.h

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          export KSU_PACKAGE_NAME="me.weishu.kernelsu.pr"
        fi
        test "${{ inputs.target }}" = "aarch64-linux-android"
        cmake -S userspace/ksud -B build/ksud -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=MinSizeRel
        cmake --build build/ksud --target ksud --parallel
        install -D build/ksud/ksud target/${{ inputs.target }}/release/ksud
        "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
          target/${{ inputs.target }}/release/ksud

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/ksud
